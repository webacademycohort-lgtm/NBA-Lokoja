<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="auth-side-content">
        <a href="../index.html" class="logo" style="margin-bottom:2rem;">
          <div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div>
          <div class="logo-text">
            <div class="top" style="color:white;">NBA Lokoja</div>
            <div class="bottom" style="color:var(--gold-light);">Admin Console</div>
          </div>
        </a>
        <h2>Administrator Access</h2>
        <p>Sign in with an authorized admin account to access dashboard controls.</p>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <h1>Admin Sign In</h1>
        <p>Only authorized branch administrators can continue.</p>
        <div id="alertBox"></div>
        <form id="adminLoginForm" data-validate>
          <div class="form-group"><label class="form-label">Email or SCN</label><input name="identifier" class="form-control" required></div>
          <div class="form-group"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
        </form>
        <p style="margin-top:1rem;"><a href="../portal/login.html">Member Login</a></p>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const identifier = e.target.identifier.value.trim();
      const password = e.target.password.value;
      alertBox.innerHTML = '<div class="alert alert-info">Signing in...</div>';

      const { data, error } = await NBAAuth.signIn(identifier, password);
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + error.message + '</div>';
        return;
      }

      const userId = data?.user?.id || data?.session?.user?.id;
      const { data: member, error: memberError } = await NBADB.getMember(userId);
      const allowed = ['admin', 'super_admin', 'secretary', 'treasurer', 'editor'];
      if (memberError || !member || !allowed.includes(member.role)) {
        await NBAAuth.signOut();
        alertBox.innerHTML = '<div class="alert alert-error">You do not have admin access.</div>';
        return;
      }

      alertBox.innerHTML = '<div class="alert alert-success">Access granted. Redirecting...</div>';
      setTimeout(() => { location.href = 'dashboard.html'; }, 700);
    });
  </script>
</body>
</html>
