<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communications - NBA Lokoja Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel-grid">
          <div class="panel">
            <div class="panel-head"><h3>Send Branch Notice</h3></div>
            <div class="panel-body">
              <div id="noticeAlert"></div>
              <form id="noticeForm" data-validate>
                <div class="form-group"><label class="form-label">Title *</label><input class="form-control" name="title" required></div>
                <div class="form-group"><label class="form-label">Message *</label><textarea class="form-control" name="body" rows="6" required></textarea></div>
                <div class="form-group"><label class="form-label">Priority</label><select class="form-control" name="priority"><option>normal</option><option>important</option><option>urgent</option></select></div>
                <button class="btn btn-primary" type="submit">Post Notice</button>
              </form>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head"><h3>Send Direct Message</h3></div>
            <div class="panel-body">
              <div id="messageAlert"></div>
              <form id="messageForm" data-validate>
                <div class="form-group"><label class="form-label">Recipient (Member ID UUID) *</label><input class="form-control" name="recipient_id" required></div>
                <div class="form-group"><label class="form-label">Subject *</label><input class="form-control" name="subject" required></div>
                <div class="form-group"><label class="form-label">Message *</label><textarea class="form-control" name="body" rows="5" required></textarea></div>
                <button class="btn btn-primary" type="submit">Send Message</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-shared.js"></script>
  <script>
    renderAdmin('comms', 'Communications');

    document.getElementById('noticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const alertBox = document.getElementById('noticeAlert');
      const session = await NBAAuth.getSession();
      const adminId = session?.data?.session?.user?.id || null;
      const { error } = await NBADB.sendNotice({
        title: f.title.value.trim(),
        body: f.body.value.trim(),
        priority: f.priority.value,
        target_audience: 'all',
        created_by: adminId
      });
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + (error.message || 'Failed to post notice.') + '</div>';
        return;
      }
      alertBox.innerHTML = '<div class="alert alert-success">Notice posted successfully.</div>';
      f.reset();
    });

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const alertBox = document.getElementById('messageAlert');
      const session = await NBAAuth.getSession();
      const adminId = session?.data?.session?.user?.id || null;
      const { error } = await NBADB.sendMessage({
        sender_id: adminId,
        recipient_id: f.recipient_id.value.trim(),
        subject: f.subject.value.trim(),
        body: f.body.value.trim()
      });
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + (error.message || 'Failed to send message.') + '</div>';
        return;
      }
      alertBox.innerHTML = '<div class="alert alert-success">Message sent successfully.</div>';
      f.reset();
    });
  </script>
</body>
</html>
