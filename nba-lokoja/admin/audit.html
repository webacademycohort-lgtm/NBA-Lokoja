<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Audit Logs - NBA Lokoja Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="portal-shell"><div data-include="sidebar"></div><div class="portal-main"><div data-include="topbar"></div><div class="portal-content">
<div class="panel"><div class="panel-head"><h3>System Audit Trail</h3><div style="display:flex;gap:.5rem;"><input id="actionFilter" class="form-control" placeholder="Action contains..." style="width:220px;padding:.45rem .75rem;"><input id="dateFilter" type="date" class="form-control" style="width:170px;padding:.45rem .75rem;"><button id="auditRefresh" class="btn btn-outline btn-sm">Refresh</button></div></div>
<div class="panel-body" style="padding:0;"><div class="table-wrap"><table class="table" style="font-family:monospace;font-size:.85rem;"><thead style="font-family:var(--font-sans);"><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Resource</th><th>Status</th></tr></thead><tbody id="auditBody"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></div></div>
</div></div></div>
<script src="../js/supabase.js"></script><script src="../js/main.js"></script><script src="../js/admin-shared.js"></script>
<script>
renderAdmin('audit','Audit Logs');
function esc(v){return String(v||'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
async function loadAudit(){
 const action = document.getElementById('actionFilter').value.trim();
 const fromDate = document.getElementById('dateFilter').value;
 const { data, error } = await NBADB.listAuditLogs({ action, fromDate, limit: 300 });
 const body = document.getElementById('auditBody');
 if(error){ body.innerHTML='<tr><td colspan="5">Unable to load audit logs.</td></tr>'; return; }
 const rows = Array.isArray(data)?data:[];
 if(!rows.length){ body.innerHTML='<tr><td colspan="5">No audit records found.</td></tr>'; return; }
 body.innerHTML = rows.map(r=>`<tr><td>${r.created_at?new Date(r.created_at).toLocaleString():'-'}</td><td>${esc(r.user_id||'system')}</td><td>${esc(r.action||'-')}</td><td>${esc([r.resource,r.resource_id].filter(Boolean).join('/'))}</td><td><span class="badge ${r.status==='success'?'badge-active':'badge-suspended'}">${esc(r.status||'-')}</span></td></tr>`).join('');
}
document.getElementById('auditRefresh').addEventListener('click', loadAudit);
loadAudit();
</script></body></html>
