<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile — NBA Lokoja Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
              <div><h3>Member Profile</h3><p id="profileSubtitle" style="margin:0;color:var(--gray);"></p></div>
              <a href="members.html" class="btn btn-outline">Back to members</a>
            </div>
          </div>
          <div class="panel-body" id="profileContent">
            <div class="card" style="padding:1rem;">Loading profile...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-shared.js"></script>
  <script>
    renderAdmin('members', 'Member Profile');

    function esc(v) { return String(v || '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function formatDate(value) { return value ? new Date(value).toLocaleString() : '-'; }

    async function loadMemberProfile() {
      const params = new URLSearchParams(window.location.search);
      const memberId = params.get('id');
      const content = document.getElementById('profileContent');
      const subtitle = document.getElementById('profileSubtitle');
      if (!memberId) {
        content.innerHTML = '<div class="alert alert-error">Member ID is missing. Please go back and select a profile.</div>';
        return;
      }
      const { data, error } = await NBADB.getMember(memberId);
      if (error || !data) {
        content.innerHTML = '<div class="alert alert-error">Unable to load member profile.</div>';
        return;
      }
      subtitle.textContent = `Profile for ${data.full_name || 'Unknown Member'}`;
      const initials = esc((data.full_name || 'NA').split(' ').map((part) => part[0]).join('').slice(0,2).toUpperCase());
      content.innerHTML = `
        <div class="card" style="padding:1.75rem; background: linear-gradient(135deg, #102a43, #1f3c70); color: white; border-radius: 20px;">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
            <div style="width:72px;height:72px;border-radius:18px;background:rgba(255,255,255,0.14);display:grid;place-items:center;font-size:1.8rem;font-weight:700;">
              ${initials}
            </div>
            <div>
              <p style="margin:.25rem 0;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;">Member Profile</p>
              <h2 style="margin:.25rem 0;font-size:2rem;">${esc(data.full_name || '-')}</h2>
              <p style="margin:.25rem 0;font-size:.95rem;opacity:.85;">${esc(data.email || 'No email provided')}</p>
            </div>
            <div style="margin-left:auto;text-align:right;min-width:160px;">
              <p style="margin:.25rem 0;opacity:.85;font-size:.85rem;">Status</p>
              <strong style="background:rgba(255,255,255,0.14);border-radius:999px;padding:.65rem 1rem;display:inline-block;color:#f8fafc;font-size:.95rem;">${esc(data.status || 'Unknown').toUpperCase()}</strong>
            </div>
          </div>
        </div>
        <div class="panel-grid" style="grid-template-columns:1.2fr 0.8fr;gap:1rem;margin-top:1rem;">
          <div class="card" style="padding:1.5rem;">
            <h4 style="margin-bottom:1rem;">Personal Information</h4>
            <div style="display:grid;gap:0.85rem;">
              <div style="display:grid;grid-template-columns:140px 1fr;gap:0.5rem;">
                <span style="font-weight:700;color:#0f172a;">Full Name</span><span style="color:#334155;">${esc(data.full_name || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Email</span><span style="color:#334155;">${esc(data.email || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Phone</span><span style="color:#334155;">${esc(data.phone || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">SCN</span><span style="color:#334155;">${esc(data.scn_number || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Title / Rank</span><span style="color:#334155;">${esc([data.title, data.rank].filter(Boolean).join(' / ') || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Gender</span><span style="color:#334155;">${esc(data.gender || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Year Called</span><span style="color:#334155;">${esc(data.year_called || '-')}</span>
              </div>
            </div>
          </div>
          <div class="card" style="padding:1.5rem;">
            <h4 style="margin-bottom:1rem;">Membership Summary</h4>
            <div style="display:grid;gap:0.85rem;">
              <div style="display:grid;grid-template-columns:140px 1fr;gap:0.5rem;">
                <span style="font-weight:700;color:#0f172a;">Membership No.</span><span style="color:#334155;">${esc(data.membership_number || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Tier</span><span style="color:#334155;">${esc(data.tier || '-')}</span>
                <span style="font-weight:700;color:#0f172a;">Role</span><span style="color:#334155;">${esc((data.role || 'member').replace('_', ' '))}</span>
                <span style="font-weight:700;color:#0f172a;">Approved At</span><span style="color:#334155;">${formatDate(data.approved_at)}</span>
                <span style="font-weight:700;color:#0f172a;">Created At</span><span style="color:#334155;">${formatDate(data.created_at)}</span>
                <span style="font-weight:700;color:#0f172a;">Updated At</span><span style="color:#334155;">${formatDate(data.updated_at)}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card" style="padding:1.5rem;margin-top:1rem;">
          <h4 style="margin-bottom:1rem;">Organization & Address</h4>
          <div style="display:grid;gap:0.85rem;grid-template-columns:140px 1fr;gap:0.5rem;">
            <span style="font-weight:700;color:#0f172a;">Organization</span><span style="color:#334155;">${esc(data.organization_name || '-')}</span>
            <span style="font-weight:700;color:#0f172a;">Address</span><span style="color:#334155;">${esc(data.address || '-')}</span>
          </div>
        </div>
      `;
    }

    loadMemberProfile();
  </script>
</body>
</html>
