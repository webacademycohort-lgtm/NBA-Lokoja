<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head"><h3>Branch Notices</h3></div>
          <div class="panel-body"><div id="noticeList"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>
    renderPortal('notices', 'Branch Notices');

    function esc(v) { return String(v || '').replace(/[&<>\"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[ch])); }

    async function loadNotices() {
      const holder = document.getElementById('noticeList');
      const { data, error } = await NBADB.listNotices();
      if (error) {
        holder.innerHTML = '<div class="alert alert-error">Unable to load notices.</div>';
        return;
      }
      const rows = Array.isArray(data) ? data : [];
      if (!rows.length) {
        holder.innerHTML = '<div class="card" style="padding:1rem;">No notices yet. You will see branch updates here when posted.</div>';
        return;
      }
      holder.innerHTML = rows.map((n) => `
        <article style="padding:1rem;background:var(--off-white);border-radius:12px;border-left:4px solid var(--navy);margin-bottom:0.8rem;">
          <h4 style="margin:0 0 0.3rem 0;">${esc(n.title)}</h4>
          <p style="margin:0;font-size:0.92rem;">${esc(n.body || '')}</p>
        </article>
      `).join('');
    }

    loadNotices();
  </script>
</body>
</html>
