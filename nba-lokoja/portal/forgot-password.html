<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="auth-side-content">
        <a href="../index.html" class="logo"><div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div><div class="logo-text"><div class="top" style="color:white;">NBA Lokoja</div><div class="bottom" style="color:var(--gold-light);">Nigerian Bar Association</div></div></a>
        <h2 style="margin-top:2rem;">Forgot your password?</h2>
        <p>It happens to the best of us. Enter your email and we'll send you a secure reset link.</p>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <a href="../index.html" class="logo"><div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div><div class="logo-text"><div class="top">NBA Lokoja</div><div class="bottom">Nigerian Bar Association</div></div></a>
        <h1>Reset Password</h1>
        <p>Enter the email associated with your account.</p>
        <div id="alertBox"></div>
        <form id="resetForm" data-validate>
          <div class="form-group"><label class="form-label">Email Address</label><input type="email" name="email" class="form-control" required></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Send Reset Link</button>
        </form>
        <p style="margin-top:1.5rem;text-align:center;font-size:0.9rem;"><a href="login.html" style="color:var(--gold-dark);font-weight:600;">← Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const { error } = await NBAAuth.resetPassword(e.target.email.value);
      alertBox.innerHTML = error
        ? '<div class="alert alert-error">' + error.message + '</div>'
        : '<div class="alert alert-success">Reset link sent! Check your email inbox.</div>';
    });
  </script>
</body>
</html>
