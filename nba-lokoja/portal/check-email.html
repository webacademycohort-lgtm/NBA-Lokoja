<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="auth-side-content">
        <a href="../index.html" class="logo" style="margin-bottom:2rem;">
          <div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div>
          <div class="logo-text">
            <div class="top" style="color:white;">NBA Lokoja</div>
            <div class="bottom" style="color:var(--gold-light);">Nigerian Bar Association</div>
          </div>
        </a>
        <h2>Almost done</h2>
        <p>Your account has been created. Confirm your email to activate secure member login.</p>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-wrap" style="max-width:560px;">
        <h1>Check Your Email</h1>
        <div id="alertBox"></div>
        <p style="margin-bottom:0.75rem;">A confirmation link has been sent to:</p>
        <p id="emailText" style="font-weight:700;color:var(--navy);margin-bottom:1.25rem;word-break:break-all;">-</p>
        <button id="resendBtn" type="button" class="btn btn-primary btn-block">Resend Confirmation Email</button>
        <p style="margin-top:1rem;color:var(--gray);font-size:0.9rem;">If you do not see the email, please check your spam/junk folder.</p>
        <p style="margin-top:1.25rem;"><a href="login.html" style="color:var(--gold-dark);font-weight:600;">Back to sign in</a></p>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const alertBox = document.getElementById('alertBox');
    const emailEl = document.getElementById('emailText');
    const resendBtn = document.getElementById('resendBtn');
    const params = new URLSearchParams(location.search);
    const email = (params.get('email') || '').trim();

    emailEl.textContent = email || 'Email not provided';

    async function checkVerifiedState() {
      const sessionResult = await NBAAuth.getSession();
      const user = sessionResult?.data?.session?.user;
      if (user && user.email_confirmed_at) {
        alertBox.innerHTML = '<div class="alert alert-success">Email verified successfully. Redirecting to dashboard...</div>';
        setTimeout(() => location.href = 'dashboard.html', 1200);
      }
    }

    resendBtn.addEventListener('click', async () => {
      if (!email) {
        alertBox.innerHTML = '<div class="alert alert-error">Email address is missing. Please return to registration.</div>';
        return;
      }
      resendBtn.disabled = true;
      alertBox.innerHTML = '<div class="alert alert-info">Sending confirmation email...</div>';
      const { error } = await NBAAuth.resendConfirmationEmail(email);
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + error.message + '</div>';
      } else {
        alertBox.innerHTML = '<div class="alert alert-success">Confirmation email sent again. Please check your inbox and spam/junk folder.</div>';
      }
      resendBtn.disabled = false;
    });

    checkVerifiedState();
  </script>
</body>
</html>
