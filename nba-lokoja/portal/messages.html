<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head"><h3>Messages</h3></div>
          <div class="panel-body" style="text-align:center;padding:3rem 1.5rem;">
            <div style="width:72px;height:72px;margin:0 auto 1rem;border-radius:50%;background:var(--off-white);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--navy);border:1px solid var(--light-gray);">@</div>
            <h4 style="margin:0 0 0.5rem;">No Messages Yet</h4>
            <p style="margin:0;color:var(--gray);max-width:520px;margin-inline:auto;">Your inbox is clean. New communications from the branch secretariat, committees, and admins will appear here.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>renderPortal('messages', 'Messages');</script>
</body>
</html>
