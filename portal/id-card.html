<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital ID Card - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .id-stage { display: grid; gap: 1rem; justify-items: center; }
    .pvc-wrap { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .pvc-card {
      width: 340px;
      aspect-ratio: 1.586;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(9, 30, 66, 0.22);
      position: relative;
      border: 1px solid rgba(12, 31, 57, 0.18);
    }
    .card-front {
      background: linear-gradient(138deg, #071f2f 0%, #0f3f73 62%, #145188 100%);
      color: #fff;
      isolation: isolate;
    }
    .card-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 9% 12%, rgba(255, 255, 255, 0.12), transparent 42%),
        radial-gradient(circle at 87% 84%, rgba(201, 162, 39, 0.18), transparent 42%),
        repeating-linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.04) 0px,
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px,
          transparent 12px
        );
      z-index: 0;
      pointer-events: none;
    }
    .card-front::after {
      content: "NBA LOKOJA";
      position: absolute;
      right: 10px;
      bottom: 8px;
      font-size: 1.02rem;
      letter-spacing: 0.12em;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.08);
      z-index: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .card-back {
      background: linear-gradient(145deg, #071f16 0%, #0f3d2e 62%, #123f68 100%);
      color: #fff;
      isolation: isolate;
    }
    .card-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.045) 0px,
          rgba(255, 255, 255, 0.045) 1px,
          transparent 1px,
          transparent 11px
        );
      opacity: 0.95;
      z-index: 0;
      pointer-events: none;
    }
    .card-back::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.12), transparent 42%),
        radial-gradient(circle at 85% 88%, rgba(201, 162, 39, 0.14), transparent 45%);
      z-index: 0;
      pointer-events: none;
    }
    .card-layer { position: absolute; inset: 0; padding: 0.9rem; display: grid; gap: 0.6rem; }
    .card-head { display: flex; align-items: center; gap: 0.6rem; }
    .card-logo { width: 42px; height: 42px; border-radius: 8px; background: #fff; padding: 3px; object-fit: contain; }
    .card-head h4 { margin: 0; font-size: 0.79rem; letter-spacing: 0.03em; font-weight: 800; }
    .card-head p { margin: 0.12rem 0 0; font-size: 0.6rem; opacity: 0.9; }
    .card-main { display: grid; grid-template-columns: 88px 1fr; gap: 0.65rem; }
    .passport {
      width: 88px;
      height: 104px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.58);
      background: rgba(255,255,255,0.12);
    }
    .passport-fallback {
      width: 88px;
      height: 104px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.4rem;
      background: rgba(255,255,255,0.16);
      border: 2px solid rgba(255,255,255,0.58);
    }
    .meta h3 { margin: 0 0 0.3rem; font-size: 0.92rem; line-height: 1.25; letter-spacing: 0.01em; }
    .meta p { margin: 0.16rem 0; font-size: 0.63rem; opacity: 0.96; }
    .footline { display: flex; justify-content: space-between; align-items: center; font-size: 0.58rem; gap: 0.35rem; }
    .chip { background: rgba(250, 204, 21, 0.2); border: 1px solid rgba(250, 204, 21, 0.5); border-radius: 999px; padding: 0.18rem 0.5rem; font-size: 0.55rem; color: #fff7d6; }
    .qr-slot { width: 58px; height: 58px; background: #fff; border-radius: 8px; padding: 4px; display: grid; place-items: center; }
    .id-front {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.5rem;
    }
    .id-front__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      padding-bottom: 0.32rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    .id-front__brand {
      display: flex;
      align-items: center;
      gap: 0.52rem;
      min-width: 0;
    }
    .id-front__logo {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.96);
      padding: 3px;
      object-fit: contain;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
    }
    .id-front__title {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .id-front__subtitle {
      margin: 0.12rem 0 0;
      font-size: 0.56rem;
      color: rgba(255, 255, 255, 0.86);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .id-front__badge {
      border: 1px solid rgba(201, 162, 39, 0.75);
      background: rgba(201, 162, 39, 0.22);
      color: #f8d46b;
      border-radius: 999px;
      padding: 0.16rem 0.5rem;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .id-front__body {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 0.7rem;
      align-items: center;
    }
    .id-front__photo-wrap {
      width: 90px;
      height: 106px;
      border-radius: 12px;
      padding: 3px;
      background: linear-gradient(145deg, rgba(201, 162, 39, 0.95), rgba(248, 212, 107, 0.6));
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }
    .id-front__photo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }
    .id-front__photo {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.34);
    }
    .id-front__photo-fallback {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      font-weight: 800;
      color: #08253c;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(246, 239, 212, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.34);
      font-family: "Playfair Display", serif;
    }
    .id-front__details { min-width: 0; }
    .id-front__name {
      margin: 0 0 0.36rem;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      letter-spacing: 0.01em;
      text-wrap: balance;
    }
    .id-front__meta {
      margin: 0;
      display: grid;
      gap: 0.18rem;
      font-size: 0.59rem;
      color: rgba(255, 255, 255, 0.93);
    }
    .id-front__meta-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 0.35rem;
      align-items: baseline;
    }
    .id-front__meta-label {
      color: #f8d46b;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .id-front__meta-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .id-front__footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 0.45rem;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    .id-front__validity {
      font-size: 0.53rem;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.3;
      max-width: 64%;
    }
    .id-front__validity strong {
      display: block;
      color: #f8d46b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.48rem;
      margin-bottom: 0.08rem;
    }
    .id-front__qr {
      width: 58px;
      height: 58px;
      border-radius: 9px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
    }
    .id-back {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 0.5rem;
    }
    .id-back__header {
      display: grid;
      gap: 0.22rem;
    }
    .id-back__title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
    }
    .id-back__title {
      margin: 0;
      font-size: 0.73rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .id-back__badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.14rem 0.44rem;
      border-radius: 999px;
      border: 1px solid rgba(248, 212, 107, 0.68);
      background: rgba(201, 162, 39, 0.2);
      color: #f8d46b;
      font-size: 0.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
    }
    .id-back__divider {
      height: 1px;
      border: none;
      margin: 0;
      background: linear-gradient(90deg, rgba(248, 212, 107, 0.9), rgba(248, 212, 107, 0.2), rgba(248, 212, 107, 0));
    }
    .id-back__main {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      align-items: start;
    }
    .id-back__info {
      font-size: 0.6rem;
      line-height: 1.4;
      display: grid;
      gap: 0.2rem;
      color: rgba(255, 255, 255, 0.95);
      text-wrap: balance;
    }
    .id-back__info strong { color: #f8d46b; }
    .id-back__qr {
      width: 64px;
      height: 64px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(250, 250, 250, 0.92));
      color: #123f68;
      display: grid;
      place-items: center;
      font-size: 0.46rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      padding: 0.2rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 5px 12px rgba(0, 0, 0, 0.16);
    }
    .id-back__notice {
      border-radius: 8px;
      border: 1px solid rgba(248, 212, 107, 0.5);
      background: rgba(255, 255, 255, 0.08);
      padding: 0.35rem 0.42rem;
      font-size: 0.52rem;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.9);
    }
    .id-back__footer {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 0.4rem;
    }
    .id-back__signature {
      min-width: 52%;
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      padding-top: 0.2rem;
      font-size: 0.52rem;
      color: rgba(255, 255, 255, 0.92);
    }
    .id-back__date {
      font-size: 0.54rem;
      color: rgba(255, 255, 255, 0.9);
      text-align: right;
      white-space: nowrap;
    }
    .pdf-stage { position: fixed; left: -99999px; top: -99999px; }
  </style>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div id="idAlert"></div>
        <div class="panel">
          <div class="panel-head"><h3>Membership ID Card</h3></div>
          <div class="panel-body">
            <div class="id-stage">
              <div class="pvc-wrap" id="idCardWrap">
                <div class="pvc-card card-front" id="frontCard"></div>
                <div class="pvc-card card-back" id="backCard"></div>
              </div>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;">
                <button id="downloadIdBtn" class="btn btn-primary">Download ID PDF</button>
                <button id="printIdBtn" class="btn btn-outline" onclick="window.print()">Print ID Card</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="pdfIdStage" class="pdf-stage"></div>

  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>
    renderPortal('id-card', 'Digital ID Card');

    let memberData = null;

    function esc(v) {
      return String(v || '').replace(/[&<>\"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[ch]));
    }

    function initials(name) {
      return (name || 'Member').split(' ').map((s) => s[0]).slice(0, 2).join('').toUpperCase();
    }

    function validityText(status) {
      if ((status || '').toLowerCase() === 'active') {
        const nextYear = new Date().getFullYear() + 1;
        return `Valid till 31 Dec ${nextYear}`;
      }
      return 'Validity subject to active membership status';
    }

    function buildQRValue(data, userId) {
      const branch = 'NBA Lokoja';
      return JSON.stringify({
        membershipId: data.membership_number || userId.slice(0, 8).toUpperCase(),
        fullName: data.full_name || 'Member',
        branch,
        status: data.status || 'pending'
      });
    }

    function frontCardHtml(data, userId) {
      const fullName = data.full_name || 'Member Name';
      const memberId = data.membership_number || userId.slice(0, 8).toUpperCase();
      const statusText = String(data.status || 'pending').toUpperCase();
      const pass = data.photo_url
        ? `<img src="${esc(data.photo_url)}" alt="Passport" class="id-front__photo">`
        : `<div class="id-front__photo-fallback">${esc(initials(fullName))}</div>`;

      return `
      <div class="card-layer">
        <div class="id-front">
          <div class="id-front__header">
            <div class="id-front__brand">
              <img class="id-front__logo" src="../assets/nba-logo.png" alt="NBA Logo">
              <div>
                <h4 class="id-front__title">NIGERIAN BAR ASSOCIATION</h4>
                <p class="id-front__subtitle">Lokoja Branch - Confluence Bar</p>
              </div>
            </div>
            <span class="id-front__badge">${esc(statusText)}</span>
          </div>
          <div class="id-front__body">
            <div class="id-front__photo-wrap">
              ${pass}
            </div>
            <div class="id-front__details">
              <h3 class="id-front__name">${esc(fullName)}</h3>
              <div class="id-front__meta">
                <div class="id-front__meta-row">
                  <span class="id-front__meta-label">Member ID</span>
                  <span class="id-front__meta-value">${esc(memberId)}</span>
                </div>
                <div class="id-front__meta-row">
                  <span class="id-front__meta-label">Branch</span>
                  <span class="id-front__meta-value">NBA Lokoja</span>
                </div>
                <div class="id-front__meta-row">
                  <span class="id-front__meta-label">SCN</span>
                  <span class="id-front__meta-value">${esc(data.scn_number || '-')}</span>
                </div>
                <div class="id-front__meta-row">
                  <span class="id-front__meta-label">Status</span>
                  <span class="id-front__meta-value">${esc(statusText)}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="id-front__footer">
            <div class="id-front__validity">
              <strong>Card Validity</strong>
              ${esc(validityText(data.status))}
            </div>
            <div id="qrContainer" class="id-front__qr"></div>
          </div>
        </div>
      </div>`;
    }

    function backCardHtml(data) {
      const issueDate = new Date().toLocaleDateString('en-NG', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
      return `
      <div class="card-layer">
        <div class="id-back">
          <div class="id-back__header">
            <div class="id-back__title-row">
              <h4 class="id-back__title">NBA LOKOJA BRANCH</h4>
              <span class="id-back__badge">Official Member ID</span>
            </div>
            <hr class="id-back__divider">
          </div>
          <div class="id-back__main">
            <div class="id-back__info">
              <div><strong>Verification:</strong> Present this card with the front QR for official validation.</div>
              <div><strong>Return Address:</strong> NBA Lokoja Secretariat, Lokoja, Kogi State.</div>
              <div><strong>Email:</strong> secretariat@nbalokoja.org</div>
              <div><strong>Website:</strong> www.nbalokoja.org</div>
            </div>
            <div class="id-back__qr">SCAN<br>FRONT QR</div>
          </div>
          <div class="id-back__notice">
            This card remains the property of NBA Lokoja Branch and may be withdrawn where membership status is suspended, revoked, or inactive.
          </div>
          <div class="id-back__footer">
            <div class="id-back__signature">Authorized Signature: Branch Secretariat</div>
            <div class="id-back__date">Issue Date: ${esc(issueDate)}</div>
          </div>
        </div>
      </div>`;
    }

    function renderCards(data, userId) {
      const front = document.getElementById('frontCard');
      const back = document.getElementById('backCard');
      front.innerHTML = frontCardHtml(data, userId);
      back.innerHTML = backCardHtml(data);

      const qrNode = front.querySelector('#qrContainer');
      qrNode.innerHTML = '';
      new QRCode(qrNode, {
        text: buildQRValue(data, userId),
        width: 48,
        height: 48,
        colorDark: '#111827',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    async function loadIdCard() {
      const alertBox = document.getElementById('idAlert');
      const session = await NBAAuth.getSession();
      const user = session?.data?.session?.user;
      if (!user?.id) {
        location.href = 'login.html';
        return;
      }

      const { data, error } = await NBADB.getMember(user.id);
      if (error || !data) {
        alertBox.innerHTML = '<div class="alert alert-error">Unable to load your ID card details.</div>';
        return;
      }

      memberData = data;
      renderCards(data, user.id);
    }

    async function exportIdPdf() {
      const alertBox = document.getElementById('idAlert');
      if (!memberData) {
        alertBox.innerHTML = '<div class="alert alert-warning">Member details not available yet.</div>';
        return;
      }

      alertBox.innerHTML = '<div class="alert alert-info">Preparing PVC-sized ID card PDF...</div>';
      const stage = document.getElementById('pdfIdStage');
      const frontClone = document.getElementById('frontCard').cloneNode(true);
      const backClone = document.getElementById('backCard').cloneNode(true);
      stage.innerHTML = '';
      stage.appendChild(frontClone);
      stage.appendChild(backClone);
      stage.style.display = 'grid';
      stage.style.gap = '16px';

      try {
        const canvases = await Promise.all([
          html2canvas(frontClone, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }),
          html2canvas(backClone, { scale: 3, useCORS: true, backgroundColor: '#ffffff' })
        ]);

        const { jsPDF } = window.jspdf;
        const cardWidthMm = 85.6;
        const cardHeightMm = 53.98;
        const gap = 8;
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        let x = 15;
        let y = 15;

        for (let i = 0; i < canvases.length; i += 1) {
          const img = canvases[i].toDataURL('image/png');
          pdf.addImage(img, 'PNG', x, y, cardWidthMm, cardHeightMm);
          x += cardWidthMm + gap;
        }

        pdf.save(`NBA_Lokoja_ID_Card_${(memberData.membership_number || 'MEMBER')}.pdf`);
        alertBox.innerHTML = '<div class="alert alert-success">ID Card PDF downloaded successfully.</div>';
        setTimeout(() => { alertBox.innerHTML = ''; }, 3000);
      } catch (error) {
        console.error(error);
        alertBox.innerHTML = '<div class="alert alert-error">Failed to generate ID PDF. Please try again.</div>';
      }

      stage.innerHTML = '';
    }

    loadIdCard();
    document.getElementById('downloadIdBtn').addEventListener('click', exportIdPdf);
  </script>
</body>
</html>
