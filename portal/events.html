<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head"><h3>Upcoming Events</h3></div>
          <div class="panel-body"><div id="eventList"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>
    renderPortal('events', 'Events');

    function esc(v) { return String(v || '').replace(/[&<>\"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[ch])); }

    async function loadEvents() {
      const holder = document.getElementById('eventList');
      const { data, error } = await NBADB.listEvents();
      if (error) {
        holder.innerHTML = '<div class="alert alert-error">Unable to load events.</div>';
        return;
      }
      const rows = Array.isArray(data) ? data : [];
      if (!rows.length) {
        holder.innerHTML = '<div class="card" style="padding:1rem;">No upcoming events yet.</div>';
        return;
      }
      holder.innerHTML = rows.map((e) => `
        <article class="event-item" style="margin-bottom:0.7rem;">
          <div class="event-info">
            <h4>${esc(e.title)}</h4>
            <div class="event-meta"><span>${esc(e.event_date)}</span><span>${esc(e.location || 'Venue TBA')}</span></div>
            <p style="margin:0.35rem 0 0 0;font-size:0.9rem;">${esc(e.description || '')}</p>
          </div>
        </article>
      `).join('');
    }

    loadEvents();
  </script>
</body>
</html>
