<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel-grid">
          <div class="panel">
            <div class="panel-head"><h3>Personal Information</h3><span class="badge badge-active">Verified</span></div>
            <div class="panel-body">
              <div id="profileAlert"></div>
              <form data-validate id="profileForm">
                <div class="form-row">
                  <div class="form-group"><label class="form-label">First Name</label><input class="form-control" name="first_name"></div>
                  <div class="form-group"><label class="form-label">Middle Name</label><input class="form-control" name="middle_name"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label class="form-label">Last Name</label><input class="form-control" name="last_name"></div>
                  <div class="form-group"><label class="form-label">Title</label><input class="form-control" name="title" readonly style="background:var(--off-white);"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label class="form-label">Rank</label><input class="form-control" name="rank" readonly style="background:var(--off-white);"></div>
                  <div class="form-group"><label class="form-label">Gender</label><select class="form-control" name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" readonly style="background:var(--off-white);"></div>
                  <div class="form-group"><label class="form-label">Phone Number</label><input class="form-control" name="phone"></div>
                </div>
                <h4 style="margin:1.5rem 0 1rem;color:var(--navy);font-family:var(--font-sans);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.15em;">Professional Details</h4>
                <div class="form-row">
                  <div class="form-group"><label class="form-label">Membership Number</label><input class="form-control" name="membership_number" readonly style="background:var(--off-white);"></div>
                  <div class="form-group"><label class="form-label">Supreme Court Number</label><input class="form-control" name="scn_number" readonly style="background:var(--off-white);"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label class="form-label">Year Called</label><input class="form-control" name="year_called" readonly style="background:var(--off-white);"></div>
                  <div class="form-group"><label class="form-label">Role (System Assigned)</label><input class="form-control" name="role" readonly style="background:var(--off-white);"></div>
                </div>
                <p class="form-help" style="margin-top:-0.25rem;margin-bottom:1rem;">Sensitive fields like role, rank, title, SCN, and membership number are managed by the system/admin.</p>
                <div class="form-group"><label class="form-label">Organization Name</label><input class="form-control" name="organization_name"></div>
                <div class="form-group"><label class="form-label">Address</label><textarea class="form-control" rows="3" name="address"></textarea></div>
                <div style="display:flex;gap:0.75rem;flex-wrap:wrap;"><button type="submit" class="btn btn-primary">Save Changes</button><button type="reset" class="btn btn-outline">Reset</button></div>
              </form>
            </div>
          </div>

          <div>
            <div class="panel">
              <div class="panel-head"><h3>Profile Photo</h3></div>
              <div class="panel-body" style="text-align:center;">
                <img id="profileAvatar" alt="Profile photo" style="width:150px;height:150px;margin:0 auto;border-radius:50%;object-fit:cover;display:none;border:4px solid var(--gold);">
                <div id="avatarFallback" style="width:150px;height:150px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:3rem;font-weight:700;border:4px solid var(--gold);">AA</div>
                <input id="passportPhotoInput" type="file" class="form-control mt-2" accept="image/png,image/jpeg,image/webp">
                <button id="uploadPassportBtn" class="btn btn-outline btn-sm mt-2" type="button">Upload New Photo</button>
                <p style="font-size:0.78rem;color:var(--gray);margin-top:0.75rem;">JPG/PNG/WEBP, max 2MB</p>
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>Account Security</h3></div>
              <div class="panel-body" style="display:flex;flex-direction:column;gap:0.6rem;">
                <div id="passwordChangeAlert"></div>
                <form id="passwordChangeForm" data-validate style="margin-bottom:1rem;">
                  <div class="form-group"><label class="form-label">Current Password *</label><input type="password" name="currentPassword" class="form-control" required></div>
                  <div class="form-group"><label class="form-label">New Password *</label><input type="password" name="newPassword" class="form-control" minlength="8" required></div>
                  <div class="form-group"><label class="form-label">Confirm New Password *</label><input type="password" name="confirmPassword" class="form-control" minlength="8" required></div>
                  <div class="form-group" style="margin-top:-0.25rem;"><label style="display:flex;gap:0.4rem;align-items:center;font-size:0.88rem;"><input id="profileShowPasswordToggle" type="checkbox"> Show passwords</label></div>
                  <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
                <a href="../pages/coming-soon.html" class="btn btn-outline"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Enable 2FA</a>
                <a href="../pages/coming-soon.html" class="btn btn-outline"><i class="fa-solid fa-list-check" aria-hidden="true"></i> Active Sessions</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>
    renderPortal('profile', 'My Profile');

    const form = document.getElementById('profileForm');
    const profileAlert = document.getElementById('profileAlert');
    const avatar = document.getElementById('profileAvatar');
    const avatarFallback = document.getElementById('avatarFallback');
    const uploadBtn = document.getElementById('uploadPassportBtn');
    const photoInput = document.getElementById('passportPhotoInput');
    let currentUserId = null;
    const MAX_PASSPORT_BYTES = 2 * 1024 * 1024;
    const ALLOWED_PASSPORT_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

    function updateAvatar(profile) {
      const initials = [profile.first_name, profile.last_name]
        .filter(Boolean)
        .map(v => v[0])
        .join('')
        .toUpperCase() || 'AA';
      avatarFallback.textContent = initials;
      if (profile.photo_url) {
        avatar.src = profile.photo_url;
        avatar.style.display = 'block';
        avatarFallback.style.display = 'none';
      } else {
        avatar.style.display = 'none';
        avatarFallback.style.display = 'flex';
      }
    }

    async function loadProfile() {
      const session = await NBAAuth.getSession();
      const user = session?.data?.session?.user;
      if (!user?.id) {
        location.href = 'login.html';
        return;
      }
      currentUserId = user.id;
      const { data, error } = await NBADB.getMember(currentUserId);
      if (error || !data) {
        profileAlert.innerHTML = '<div class="alert alert-error">Could not load profile data.</div>';
        return;
      }
      form.first_name.value = data.first_name || '';
      form.middle_name.value = data.middle_name || '';
      form.last_name.value = data.last_name || '';
      form.title.value = data.title || '';
      form.rank.value = data.rank || '';
      form.role.value = data.role || '';
      form.gender.value = data.gender || '';
      form.email.value = data.email || '';
      form.phone.value = data.phone || '';
      form.membership_number.value = data.membership_number || '';
      form.scn_number.value = data.scn_number || '';
      form.year_called.value = data.year_called || '';
      form.organization_name.value = data.organization_name || data.chambers || '';
      form.address.value = data.address || '';
      updateAvatar(data);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const updates = {
        first_name: form.first_name.value.trim(),
        middle_name: form.middle_name.value.trim(),
        last_name: form.last_name.value.trim(),
        gender: form.gender.value || null,
        phone: form.phone.value.trim(),
        organization_name: form.organization_name.value.trim(),
        chambers: form.organization_name.value.trim(),
        address: form.address.value.trim(),
        full_name: [form.first_name.value.trim(), form.middle_name.value.trim(), form.last_name.value.trim()].filter(Boolean).join(' ')
      };
      const { error } = await NBADB.updateMember(currentUserId, updates);
      if (error) {
        profileAlert.innerHTML = '<div class="alert alert-error">' + error.message + '</div>';
        return;
      }
      profileAlert.innerHTML = '<div class="alert alert-success">Profile updated successfully.</div>';
      showToast('Profile updated successfully', 'success');
      updateAvatar(updates);
    });

    uploadBtn.addEventListener('click', async () => {
      const file = photoInput.files?.[0];
      const alertError = (message) => {
        profileAlert.innerHTML = `<div class="alert alert-error">${message}</div>`;
        showToast(message, 'error');
      };
      const alertInfo = (message) => { profileAlert.innerHTML = `<div class="alert alert-info">${message}</div>`; };
      const alertSuccess = (message) => {
        profileAlert.innerHTML = `<div class="alert alert-success">${message}</div>`;
        showToast(message, 'success');
      };

      if (!currentUserId) {
        const session = await NBAAuth.getSession();
        const user = session?.data?.session?.user;
        if (!user?.id) {
          alertError('You are not logged in. Please sign in again.');
          setTimeout(() => { location.href = 'login.html'; }, 1000);
          return;
        }
        currentUserId = user.id;
      }

      if (!file) {
        alertError('No file selected. Please choose a passport image.');
        return;
      }
      if (ALLOWED_PASSPORT_TYPES.indexOf(String(file.type || '').toLowerCase()) === -1) {
        alertError('Invalid file type. Upload JPG, PNG, or WEBP only.');
        return;
      }
      if (Number(file.size || 0) > MAX_PASSPORT_BYTES) {
        alertError('File too large. Maximum allowed size is 2MB.');
        return;
      }

      alertInfo('Uploading passport photo...');
      uploadBtn.disabled = true;

      try {
        const upload = await NBAStorage.uploadPassport(currentUserId, file);
        if (upload.error || !upload.data?.path) {
          alertError(upload.error?.message || 'Upload failed. Please try again.');
          return;
        }

        const publicUrlResult = NBAStorage.getPassportPublicUrl(upload.data.path);
        const publicUrl = publicUrlResult?.data?.publicUrl;
        if (!publicUrl) {
          alertError('Upload succeeded, but image URL could not be generated.');
          return;
        }

        const profileUpdate = await NBADB.updateMember(currentUserId, { photo_url: publicUrl });
        if (profileUpdate.error) {
          alertError('Image uploaded, but failed to update profile record. Please try again.');
          return;
        }

        avatar.src = publicUrl;
        avatar.style.display = 'block';
        avatarFallback.style.display = 'none';
        photoInput.value = '';
        alertSuccess('Passport photo updated successfully.');
      } catch (error) {
        alertError('Unexpected error while uploading photo. Please try again.');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    document.getElementById('profileShowPasswordToggle').addEventListener('change', (e) => {
      const type = e.target.checked ? 'text' : 'password';
      const passwordForm = document.getElementById('passwordChangeForm');
      passwordForm.currentPassword.type = type;
      passwordForm.newPassword.type = type;
      passwordForm.confirmPassword.type = type;
    });

    document.getElementById('passwordChangeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const alertBox = document.getElementById('passwordChangeAlert');
      const currentPassword = form.currentPassword.value;
      const newPassword = form.newPassword.value;
      const confirmPassword = form.confirmPassword.value;

      if (newPassword !== confirmPassword) {
        alertBox.innerHTML = '<div class="alert alert-error">New passwords do not match.</div>';
        return;
      }

      if (newPassword.length < 8) {
        alertBox.innerHTML = '<div class="alert alert-error">New password must be at least 8 characters long.</div>';
        return;
      }

      alertBox.innerHTML = '<div class="alert alert-info">Changing password...</div>';

      try {
        // First verify current password by attempting sign in
        const session = await NBAAuth.getSession();
        const user = session?.data?.session?.user;
        if (!user?.email) {
          alertBox.innerHTML = '<div class="alert alert-error">Session expired. Please sign in again.</div>';
          return;
        }

        const { error: verifyError } = await supabaseClient.auth.signInWithPassword({
          email: user.email,
          password: currentPassword
        });

        if (verifyError) {
          alertBox.innerHTML = '<div class="alert alert-error">Current password is incorrect.</div>';
          return;
        }

        // Update password
        const { error: updateError } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (updateError) {
          alertBox.innerHTML = '<div class="alert alert-error">' + updateError.message + '</div>';
          return;
        }

        alertBox.innerHTML = '<div class="alert alert-success">Password changed successfully.</div>';
        form.reset();
        showToast('Password changed successfully', 'success');
      } catch (error) {
        alertBox.innerHTML = '<div class="alert alert-error">Failed to change password. Please try again.</div>';
      }
    });

    loadProfile();
  </script>
</body>
</html>
