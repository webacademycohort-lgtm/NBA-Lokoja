<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password — NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div class="auth-side-content">
        <a href="../index.html" class="logo"><div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div><div class="logo-text"><div class="top" style="color:white;">NBA Lokoja</div><div class="bottom" style="color:var(--gold-light);">Nigerian Bar Association</div></div></a>
        <h2 style="margin-top:2rem;">Set a new password</h2>
        <p>Enter your new password below to complete the password reset.</p>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <a href="../index.html" class="logo"><div class="logo-mark"><img src="../assets/nba-logo.png" alt="Nigerian Bar Association logo"></div><div class="logo-text"><div class="top">NBA Lokoja</div><div class="bottom">Nigerian Bar Association</div></div></a>
        <h1>Create New Password</h1>
        <div id="alertBox"></div>
        <form id="resetForm" data-validate>
          <div class="form-group"><label class="form-label">New Password</label><input type="password" name="password" class="form-control" required minlength="8" placeholder="Enter a strong password"></div>
          <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" name="confirmPassword" class="form-control" required placeholder="Confirm your password"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Save Password</button>
        </form>
        <p style="margin-top:1.5rem;text-align:center;font-size:0.9rem;"><a href="login.html" style="color:var(--gold-dark);font-weight:600;">← Back to login</a></p>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');

    async function initializeResetPage() {
      if (!window.supabase || !window.supabase.createClient) {
        alertBox.innerHTML = '<div class="alert alert-error">Unable to initialize password reset. Please try again later.</div>';
        return;
      }
      try {
        const { error } = await supabaseClient.auth.getSessionFromUrl();
        if (error) {
          alertBox.innerHTML = '<div class="alert alert-error">Invalid or expired reset link. Please request a new reset email.</div>';
          form.style.display = 'none';
          return;
        }
      } catch (err) {
        console.warn('Reset session parse error:', err);
      }
      const params = new URLSearchParams(window.location.search);
      if (!params.has('access_token')) {
        alertBox.innerHTML = '<div class="alert alert-warning">If you landed here directly, please use the reset link sent to your email.</div>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '<div class="alert alert-info">Saving your new password...</div>';
      const password = e.target.password.value.trim();
      const confirmPassword = e.target.confirmPassword.value.trim();
      if (!password || password.length < 8) {
        alertBox.innerHTML = '<div class="alert alert-error">Password must be at least 8 characters long.</div>';
        return;
      }
      if (password !== confirmPassword) {
        alertBox.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>';
        return;
      }
      const { data, error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + error.message + '</div>';
        return;
      }
      alertBox.innerHTML = '<div class="alert alert-success">Password updated successfully. Redirecting to login...</div>';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    });

    initializeResetPage();
  </script>
</body>
</html>
