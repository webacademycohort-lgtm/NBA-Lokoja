<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head"><h3>Resource Library</h3></div>
          <div class="panel-body" id="resourceList"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/portal-shared.js"></script>
  <script>
    renderPortal('resources', 'Resource Library');
    function esc(v){return String(v||'').replace(/[&<>\"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}

    async function loadResources(){
      const holder = document.getElementById('resourceList');
      const { data, error } = await NBADB.listPublications();
      if (error) {
        holder.innerHTML = '<div class="alert alert-error">Unable to load resources.</div>';
        return;
      }
      const rows = Array.isArray(data) ? data : [];
      if (!rows.length) {
        holder.innerHTML = '<div class="card" style="padding:1rem;">Resource library is empty.</div>';
        return;
      }
      holder.innerHTML = rows.map((r)=>`<div style="padding:0.85rem;background:var(--off-white);border-radius:10px;margin-bottom:0.6rem;"><h5 style="margin:0 0 0.25rem 0;">${esc(r.title)}</h5><div style="font-size:0.8rem;color:var(--gray);">${esc(r.type||'Document')} · ${r.members_only?'Members Only':'Public'}</div></div>`).join('');
    }

    loadResources();
  </script>
</body>
</html>
