<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Lawyers - NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>const BASE = '../';</script>
</head>
<body>
  <div data-include="header"></div>

  <section class="page-banner">
    <div class="container">
      <h1>Find Lawyers</h1>
      <div class="breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Find Lawyers</span></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head fade-in">
        <span class="section-eyebrow">Public Directory</span>
        <h2>Search Active NBA Lokoja Lawyers</h2>
        <p>Find lawyers by name, SCN number, or chambers and contact them directly.</p>
      </div>

      <div class="card fade-in" style="padding:1.2rem; margin-bottom:1.5rem;">
        <form id="lawyerSearchForm" style="display:grid;grid-template-columns:2fr 1fr auto;gap:0.75rem;align-items:end;">
          <div class="form-group" style="margin:0;position:relative;">
            <label class="form-label">Search</label>
            <input id="lawyerQuery" type="search" class="form-control" placeholder="Name, SCN, or chambers">
            <div id="lawyerSuggestions" style="display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--light-gray);border-radius:10px;box-shadow:var(--shadow-md);z-index:30;max-height:280px;overflow:auto;"></div>
          </div>
          <div class="form-group" style="margin:0;">
            <label class="form-label">Practice Area</label>
            <input id="practiceArea" class="form-control" placeholder="e.g. Corporate Law">
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>

      <div id="lawyerAlert"></div>
      <div id="lawyerResultMeta" style="margin-bottom:0.8rem;color:var(--gray);font-size:0.9rem;"></div>
      <div id="lawyerGrid" class="grid grid-3"></div>
    </div>
  </section>

  <div data-include="footer"></div>

  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/partials.js"></script>
  <script>
    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function renderLawyerCards(rows) {
      const grid = document.getElementById('lawyerGrid');
      if (!rows.length) {
        grid.innerHTML = '<div class="card" style="padding:1.2rem;">No lawyers found for this search.</div>';
        return;
      }
      grid.innerHTML = rows.map((m) => {
        const name = esc(m.full_name || 'Unnamed');
        const initials = name.split(' ').filter(Boolean).slice(0, 2).map((s) => s[0]).join('').toUpperCase() || 'NB';
        const title = esc(m.title || 'Barr.');
        const rank = esc(m.rank || 'Member');
        const scn = esc(m.scn_number || 'N/A');
        const firm = esc(m.organization_name || 'Not specified');
        const yearCalled = m.year_called ? `Called to Bar: ${esc(m.year_called)}` : 'Year called not provided';
        const phone = m.phone ? String(m.phone) : '';
        const email = m.email ? String(m.email) : '';
        const areas = Array.isArray(m.practice_areas) && m.practice_areas.length ? m.practice_areas.join(', ') : 'Practice areas not listed';
        const phoneBtn = phone ? `<a class="btn btn-outline btn-sm" href="tel:${esc(phone)}">Call</a>` : '';
        const mailBtn = email ? `<a class="btn btn-primary btn-sm" href="mailto:${esc(email)}">Email</a>` : '';
        return `
          <article class="card" style="padding:1.2rem;">
            <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.7rem;">
              <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-serif);">${initials}</div>
              <div>
                <h4 style="margin:0;">${title} ${name}</h4>
                <div style="font-size:0.78rem;color:var(--gold-dark);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;">${rank}</div>
              </div>
            </div>
            <p style="margin:0 0 0.4rem 0;"><strong>SCN:</strong> <span style="font-family:monospace;">${scn}</span></p>
            <p style="margin:0 0 0.4rem 0;"><strong>Chambers:</strong> ${firm}</p>
            <p style="margin:0 0 0.4rem 0;"><strong>${yearCalled}</strong></p>
            <p style="margin:0 0 1rem 0;"><strong>Practice Areas:</strong> ${esc(areas)}</p>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
              ${phoneBtn}
              ${mailBtn}
            </div>
          </article>
        `;
      }).join('');
    }

    async function performSearch() {
      const alertBox = document.getElementById('lawyerAlert');
      const meta = document.getElementById('lawyerResultMeta');
      const query = document.getElementById('lawyerQuery').value.trim();
      const practiceArea = document.getElementById('practiceArea').value.trim();

      alertBox.innerHTML = '<div class="alert alert-info">Loading lawyers...</div>';
      meta.textContent = '';
      const { data, error } = await NBADB.searchLawyers({ query, practiceArea, limit: 120 });
      if (error) {
        alertBox.innerHTML = '<div class="alert alert-error">Directory search failed: ' + esc(error.message || 'Unable to load lawyers right now.') + '</div>';
        return;
      }
      alertBox.innerHTML = '';
      const rows = Array.isArray(data) ? data : [];
      meta.textContent = rows.length + ' lawyer(s) found';
      renderLawyerCards(rows);
    }

    let suggestTimer = null;
    function hideSuggestions() {
      const box = document.getElementById('lawyerSuggestions');
      box.style.display = 'none';
      box.innerHTML = '';
    }

    function renderSuggestions(rows) {
      const box = document.getElementById('lawyerSuggestions');
      if (!rows.length) {
        hideSuggestions();
        return;
      }
      box.innerHTML = rows.slice(0, 8).map((m) => {
        const name = esc(m.full_name || 'Unnamed');
        const firm = esc(m.organization_name || 'Chambers not provided');
        return `<button type="button" data-name="${name}" class="lawyer-suggest-item" style="width:100%;text-align:left;padding:0.7rem 0.85rem;border:none;background:var(--white);cursor:pointer;border-bottom:1px solid var(--light-gray);"><strong style="display:block;color:var(--navy);font-size:0.92rem;">${name}</strong><span style="display:block;color:var(--gray);font-size:0.8rem;">${firm}</span></button>`;
      }).join('');
      box.style.display = 'block';
    }

    async function fetchSuggestions() {
      const query = document.getElementById('lawyerQuery').value.trim();
      if (query.length < 2) {
        hideSuggestions();
        return;
      }
      const { data, error } = await NBADB.searchLawyers({ query, limit: 8 });
      if (error) {
        console.warn('Lawyer suggestion search failed:', error);
        hideSuggestions();
        return;
      }
      renderSuggestions(Array.isArray(data) ? data : []);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const queryInput = document.getElementById('lawyerQuery');
      const suggestionsBox = document.getElementById('lawyerSuggestions');

      document.getElementById('lawyerSearchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideSuggestions();
        await performSearch();
      });

      queryInput.addEventListener('input', () => {
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(fetchSuggestions, 220);
      });

      queryInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') hideSuggestions();
      });

      suggestionsBox.addEventListener('click', async (e) => {
        const btn = e.target.closest('.lawyer-suggest-item');
        if (!btn) return;
        queryInput.value = btn.getAttribute('data-name') || '';
        hideSuggestions();
        await performSearch();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#lawyerSuggestions') && !e.target.closest('#lawyerQuery')) hideSuggestions();
      });

      performSearch();
    });
  </script>
</body>
</html>
