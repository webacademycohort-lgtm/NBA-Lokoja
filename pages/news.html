<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Announcements — NBA Lokoja</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>const BASE = '../';</script>
</head>
<body>
  <div data-include="header"></div>

  <section class="page-banner">
    <div class="container">
      <h1>News & Announcements</h1>
      <div class="breadcrumb"><a href="../index.html">Home</a><span>/</span><span>News</span></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid-3" id="newsGrid">
        <div class="card" style="padding:1.5rem;grid-column:1/-1;text-align:center;">Loading news...</div>
      </div>
    </div>
  </section>

  <div data-include="footer"></div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/partials.js"></script>
  <script>
    async function renderNewsPage() {
      console.log('renderNewsPage called');
      const grid = document.getElementById('newsGrid');
      if (!grid) return;
      grid.innerHTML = '<div class="card" style="padding:1.5rem;grid-column:1/-1;text-align:center;">Loading news...</div>';
      const { data, error } = await NBADB.listNews();
      console.log('listNews result:', { data, error });
      if (error) {
        grid.innerHTML = '<div class="card" style="padding:1.5rem;grid-column:1/-1;text-align:center;">Unable to load news posts.</div>';
        return;
      }
      const posts = Array.isArray(data) ? data : [];
      if (!posts.length) {
        // Mock data for testing
        posts.push({
          title: 'Welcome to NBA Lokoja',
          excerpt: 'The Nigerian Bar Association Lokoja Branch welcomes all members to our new digital platform.',
          body: '<p>We are excited to launch our new website with enhanced features for members.</p><p>This includes online dues payment, member directory, and news updates.</p>',
          category: 'Announcement',
          published_at: new Date().toISOString()
        });
        posts.push({
          title: 'CLE Program Updates',
          excerpt: 'New continuing legal education programs are now available.',
          body: '<p>Stay updated with the latest legal developments through our CLE programs.</p><p>Register now for upcoming sessions.</p>',
          category: 'Education',
          published_at: new Date().toISOString()
        });
      }
      grid.innerHTML = posts.map((post) => {
        const date = post.published_at ? new Date(post.published_at).toLocaleDateString() : 'Draft';
        const excerpt = (post.excerpt || post.body || '').replace(/<[^>]+>/g, '').trim();
        const summary = excerpt.length > 160 ? excerpt.slice(0, 160) + '...' : excerpt;
        const fullContent = post.body || '';
        return `
          <article class="img-card fade-in">
            <div class="img-card-image"><img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=800&q=80" alt="${post.category || 'News'} image"></div>
            <div class="img-card-body">
              <div class="img-card-meta"><span><i class="fa-regular fa-calendar" aria-hidden="true"></i> ${date}</span><span class="tag">${post.category || 'Announcement'}</span></div>
              <h3>${post.title || 'Untitled post'}</h3>
              <div style="margin:1rem 0;color:#475569;line-height:1.6;">${fullContent}</div>
              <p style="margin:0.5rem 0;color:#64748b;font-size:0.9rem;">${summary}</p>
            </div>
          </article>
        `;
      }).join('');
    }
    renderNewsPage();
  </script>
</body>
</html>
