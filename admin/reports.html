<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports - NBA Lokoja Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="portal-shell"><div data-include="sidebar"></div><div class="portal-main"><div data-include="topbar"></div><div class="portal-content">
<div class="panel"><div class="panel-head"><h3>Reports Generator</h3><div style="display:flex;gap:.5rem;"><select id="reportType" class="form-control" style="width:220px;padding:.45rem .75rem;"><option value="membership">Membership Report</option><option value="payments">Payments Report</option><option value="pending">Pending Applications</option><option value="audit">Audit Logs</option></select><button id="generateBtn" class="btn btn-primary btn-sm">Generate CSV</button></div></div><div class="panel-body"><p style="margin:0;color:var(--gray);">Generate and download current live data as CSV for sharing or archival.</p></div></div>
<div class="panel"><div class="panel-head"><h3>Preview</h3></div><div class="panel-body"><pre id="reportPreview" style="white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;margin:0;">Select a report and click Generate CSV.</pre></div></div>
</div></div></div>
<script src="../js/supabase.js"></script><script src="../js/main.js"></script><script src="../js/admin-shared.js"></script>
<script>
renderAdmin('reports','Reports Generator');
function toCsv(rows){ if(!rows.length) return 'No data'; const headers = Object.keys(rows[0]); const esc = (v)=>`"${String(v??'').replace(/"/g,'""')}"`; return [headers.join(','), ...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n'); }
function downloadCsv(filename, csv){ const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'}); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
async function buildReport(type){
 if(type==='membership'){ const r=await NBADB.listMembers(); return (r.data||[]).map(m=>({id:m.id,name:m.full_name,email:m.email,scn:m.scn_number,status:m.status,role:m.role,tier:m.tier,created_at:m.created_at})); }
 if(type==='payments'){ const r=await NBADB.listPaymentsAdmin({limit:1000}); return (r.data||[]).map(p=>({reference:p.reference,member:(p.members&&p.members.full_name)||'',amount:p.amount,status:p.status,method:p.method,paid_at:p.paid_at,created_at:p.created_at})); }
 if(type==='pending'){ const r=await NBADB.listMembers({status:'pending'}); return (r.data||[]).map(m=>({name:m.full_name,email:m.email,scn:m.scn_number,tier:m.tier,created_at:m.created_at})); }
 const r=await NBADB.listAuditLogs({limit:1000}); return (r.data||[]).map(a=>({created_at:a.created_at,user_id:a.user_id,action:a.action,resource:a.resource,resource_id:a.resource_id,status:a.status}));
}
async function generate(){
 const type = document.getElementById('reportType').value;
 const rows = await buildReport(type);
 const csv = toCsv(rows);
 document.getElementById('reportPreview').textContent = csv.slice(0, 8000);
 downloadCsv(`nba-lokoja-${type}-report.csv`, csv);
}
document.getElementById('generateBtn').addEventListener('click', generate);
</script></body></html>
