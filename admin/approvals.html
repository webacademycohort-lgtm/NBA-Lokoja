<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Approvals - NBA Lokoja Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="portal-shell">
  <div data-include="sidebar"></div>
  <div class="portal-main">
    <div data-include="topbar"></div>
    <div class="portal-content">
      <div class="stats-grid">
        <div class="stat-card gold"><span class="lbl">Pending Review</span><span class="num" id="pendingCount">0</span></div>
        <div class="stat-card green"><span class="lbl">Approved (30d)</span><span class="num" id="approvedCount">0</span></div>
        <div class="stat-card red"><span class="lbl">Rejected (30d)</span><span class="num" id="rejectedCount">0</span></div>
        <div class="stat-card navy"><span class="lbl">Total Members</span><span class="num" id="totalCount">0</span></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Pending Membership Applications</h3></div>
        <div class="panel-body" style="padding:0;">
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Name</th><th>Email</th><th>SCN</th><th>Tier</th><th>Submitted</th><th>Action</th></tr></thead>
              <tbody id="pendingBody"><tr><td colspan="6">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../js/supabase.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin-shared.js"></script>
<script>
renderAdmin('approvals','Application Approvals');
function esc(v){return String(v||'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
async function loadStats(){
  const all = await NBADB.listMembers();
  const rows = Array.isArray(all.data)?all.data:[];
  const d30 = Date.now()-30*24*3600*1000;
  document.getElementById('totalCount').textContent = rows.length;
  document.getElementById('pendingCount').textContent = rows.filter(r=>r.status==='pending').length;
  document.getElementById('approvedCount').textContent = rows.filter(r=>r.status==='active' && r.approved_at && new Date(r.approved_at).getTime()>=d30).length;
  document.getElementById('rejectedCount').textContent = rows.filter(r=>r.status==='rejected' && r.updated_at && new Date(r.updated_at).getTime()>=d30).length;
}
async function loadPending(){
  const body = document.getElementById('pendingBody');
  const { data, error } = await NBADB.listMembers({ status: 'pending' });
  if(error){ body.innerHTML='<tr><td colspan="6">Unable to load applications.</td></tr>'; return; }
  const rows = Array.isArray(data)?data:[];
  if(!rows.length){ body.innerHTML='<tr><td colspan="6">No pending applications.</td></tr>'; return; }
  body.innerHTML = rows.map(r=>`<tr>
    <td>${esc(r.full_name||'Unnamed')}</td><td>${esc(r.email||'-')}</td><td>${esc(r.scn_number||'-')}</td>
    <td>${esc(r.tier||'-')}</td><td>${r.created_at?new Date(r.created_at).toLocaleString():'-'}</td>
    <td>
      <button class="btn btn-sm" style="background:var(--green);color:#fff;" data-id="${r.id}" data-action="approve">Approve</button>
      <button class="btn btn-outline btn-sm" style="border-color:var(--red);color:var(--red);" data-id="${r.id}" data-action="reject">Reject</button>
    </td></tr>`).join('');
}
async function takeAction(memberId, action){
  const s = await NBAAuth.getSession();
  const adminId = s?.data?.session?.user?.id || null;
  const status = action==='approve' ? 'active' : 'rejected';
  const res = await NBADB.updateMemberStatus(memberId, status, adminId);
  if(res.error){ alert(res.error.message || 'Action failed.'); return; }
  await NBADB.createAuditLog({ user_id: adminId, action: action==='approve'?'APPROVE_APPLICATION':'REJECT_APPLICATION', resource:'members', resource_id:memberId, status:'success' });
  loadPending(); loadStats();
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  takeAction(btn.dataset.id, btn.dataset.action);
});
loadStats(); loadPending(); NBADB.subscribeNewMembers(()=>{loadStats();loadPending();});
</script>
</body>
</html>
