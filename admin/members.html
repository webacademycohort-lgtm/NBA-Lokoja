<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Management - NBA Lokoja Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="portal-shell">
    <div data-include="sidebar"></div>
    <div class="portal-main">
      <div data-include="topbar"></div>
      <div class="portal-content">
        <div class="panel">
          <div class="panel-head">
            <h3>All Members</h3>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
              <input id="memberSearchInput" class="form-control" placeholder="Search by name, email or SCN..." style="width:260px;padding:0.5rem 0.75rem;font-size:0.85rem;">
              <select id="memberStatusFilter" class="form-control" style="width:160px;padding:0.5rem 0.75rem;font-size:0.85rem;">
                <option value="">All Status</option><option value="active">Active</option><option value="pending">Pending</option><option value="suspended">Suspended</option><option value="expired">Expired</option><option value="rejected">Rejected</option>
              </select>
            </div>
          </div>
          <div class="panel-body" style="padding:0;">
            <div class="table-wrap">
              <table class="table">
                <thead><tr>
                  <th>Name</th><th>Email</th><th>SCN</th><th>Tier</th><th>Role</th><th>Status</th><th>Created</th><th>Action</th>
                </tr></thead>
                <tbody id="membersTableBody">
                  <tr><td colspan="8" style="color:var(--gray);">Loading members...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/supabase.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-shared.js"></script>
  <script>
    renderAdmin('members', 'Member Management');
    let allMembers = [];
    function esc(v){return String(v||'').replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function badge(status) {
      if (status === 'active') return 'badge badge-active';
      if (status === 'pending') return 'badge badge-pending';
      if (status === 'suspended') return 'badge badge-suspended';
      return 'badge';
    }
    function renderRows() {
      const body = document.getElementById('membersTableBody');
      const q = (document.getElementById('memberSearchInput').value || '').trim().toLowerCase();
      const statusFilter = document.getElementById('memberStatusFilter').value;
      const rows = allMembers.filter((m) => {
        const matchesStatus = !statusFilter || m.status === statusFilter;
        const hay = `${m.full_name || ''} ${m.email || ''} ${m.scn_number || ''}`.toLowerCase();
        const matchesSearch = !q || hay.includes(q);
        return matchesStatus && matchesSearch;
      });
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" style="color:var(--gray);">No members match current filters.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((m) => `
        <tr>
          <td><strong>${esc(m.full_name || 'Unnamed Member')}</strong></td>
          <td>${esc(m.email || '-')}</td>
          <td>${esc(m.scn_number || '-')}</td>
          <td>${esc(m.tier || '-')}</td>
          <td>${esc((m.role || 'member').replace('_', ' '))}</td>
          <td><span class="${badge(m.status)}">${esc(m.status || 'pending')}</span></td>
          <td>${m.created_at ? new Date(m.created_at).toLocaleDateString() : '-'}</td>
          <td><a class="btn btn-outline btn-sm" href="member-profile.html?id=${encodeURIComponent(m.id)}">View</a></td>
        </tr>
      `).join('');
    }
    async function loadMembers() {
      const body = document.getElementById('membersTableBody');
      const { data, error } = await NBADB.listMembers();
      if (error) {
        body.innerHTML = '<tr><td colspan="7">Unable to load members.</td></tr>';
        return;
      }
      allMembers = Array.isArray(data) ? data : [];
      renderRows();
    }
    document.getElementById('memberSearchInput').addEventListener('input', renderRows);
    document.getElementById('memberStatusFilter').addEventListener('change', renderRows);
    loadMembers();
    NBADB.subscribeNewMembers(() => loadMembers());
  </script>
</body>
</html>
